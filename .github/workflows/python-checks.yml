name: Python checks
on:
  push:
    branches: [main]
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: python -m pip install -r benchmarks/python/requirements.txt
      - name: Syntax check
        run: python -m compileall -q FANET_UAV benchmarks
      - name: Contract tests
        run: python -m unittest discover -s benchmarks/python/tests -p test_metric_contract.py -v
